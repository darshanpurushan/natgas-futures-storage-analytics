[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natgas-futures-storage-analytics"
version = "0.1.0"
description = "Beginner-friendly Henry Hub futures curve and storage research toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
